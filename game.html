<body class="game-page">

  <section class="section">

        <h2 class="section-title">
          <span class="first-letter">G</span>AME

      <div class="game-view" id="game-detail-view">
        <div class="game-detail" id="game-detail">
          <!-- game-loader.jsで動的生成 -->

      </div>
    </div>
